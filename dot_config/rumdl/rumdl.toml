# ~/.config/rumdl/rumdl.toml — global rumdl defaults for every project.
# rumdl loads this ONLY when a project has no .rumdl.toml of its own. A project
# config fully REPLACES this unless it opts in with:
#   extends = "~/.config/rumdl/rumdl.toml"
#
# The rules themselves live in house.rumdl.toml (shared with the plan-mode-plans
# gate's plan.rumdl.toml); this file adds only the global carve-outs below.

extends = "house.rumdl.toml"

[global]
# We intentionally use raw inline HTML in markdown.
extend-disable = ["MD033"]

# Only genuinely non-authored / generated / boilerplate content is excluded.
exclude = [
  ".git",
  ".github",
  ".beads",           # generated
  "node_modules",
  "vendor",
  "dist",
  "build",
  "CHANGELOG.md",     # generated
  "LICENSE.md",       # boilerplate
  ".agents/skills/*.md",  # frequently symlinked third-party skills
  ".claude/skills/*.md",
]
