    cmd: llama-server --port ${PORT} --ctx-size 65536 --cache-type-k q8_0 --cache-type-v q8_0 --cache-reuse 256 -ngl 99 --flash-attn auto --batch-size 2048 --ubatch-size 512 --parallel 1 --cont-batching --jinja --reasoning-format deepseek --model /Users/jamesbombeelu/.cache/huggingface/models/unsloth/Qwen3.5-122B-A10B-GGUF/Q4_K_M/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf --mmproj /Users/jamesbombeelu/.cache/huggingface/models/unsloth/Qwen3.5-122B-A10B-GGUF/mmproj-F16.gguf
    ttl: 600
    timeouts:
      responseHeader: 300
    filters:
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:thinking":
          chat_template_kwargs:
            enable_thinking: true
