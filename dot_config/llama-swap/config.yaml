  # MTP-enabled twin of the censored Qwen3.6-27B above — same UD-Q5_K_XL weights
  # and sampling, but pulled from unsloth's `-MTP-GGUF` repo, which preserves the
  # native MTP heads that the plain `-GGUF` repo (the daily 27B) strips. Isolates
