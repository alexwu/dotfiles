  # real risk is an OOM/slot-corruption bug class (llama.cpp#23371, #22867) that
  # only bites under long-ctx + `-np > 1` — this entry is ctx 32768, parallel 1,
  # so it dodges that. Drop `--spec-draft-*` (vision, no MTP) or `--mmproj`
  # (text-only MTP) if it misbehaves. Default group (experiment) — promote to
