  # MTP: `--spec-type draft-mtp` ENABLED. n-max 3 to match the 27B-heretic,
  # which measured fastest at 3 on this build (the MoE's own n-max sweep is
  # untested — its gain is marginal regardless). Measured: loads clean (5.5s),
  # 92-93 tok/s at ~38% accept (n-max 3), uncensored vision confirmed. The
  # MoE's MTP gain is small — unsloth benchmarks MoE at 1.15-1.25x (vs dense
