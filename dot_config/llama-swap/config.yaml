  # drop `--mmproj` (text-only MTP) or the two `--spec-*` flags (vision, no MTP).
  # Left in the DEFAULT group (not workhorse) while it's an experiment — promote
  # into `workhorse` if it earns a permanent slot. Weights via pueue
