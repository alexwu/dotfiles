    timeouts:
      responseHeader: 120
  # gemma-4 E4B-it — instruction-tuned "edge" variant (Per-Layer-Embeddings /
  # MatFormer, ~4B effective). Official ggml-org GGUF. Lightweight candidate for a
  # fast FIRST-PASS classifier ahead of the 26B, AND it does AUDIO: the bf16 mmproj
  # is a COMBINED vision+audio projector (llama.cpp PR #21421 — gemma-4 Conformer
  # audio encoder). bf16 mmproj is REQUIRED for audio — f16/Q8 garble the audio
  # conformer (ClippableLinear precision: cos-sim 0.999→0.685 by layer 11).
  # Flags: --reasoning off (gemma thought-channel wedge fix; no-op if E4B has none)
  # + --jinja (model's own chat template, needed for the multimodal -it template)
  # + Google's gemma sampling. AUDIO via llama-server = the `image_url` content
  # part with a data:audio/wav;base64 URL (NOT OpenAI input_audio), audio placed
  # BEFORE text, 16kHz, 30s chunks. Default group — promote to always-on if it
  # earns the router job. (Earlier mradermacher `gemma-4-E4B` was the BASE model —
