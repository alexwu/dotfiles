# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

groups:
  "always-on":
    persistent: true
    swap: false
    exclusive: false
    members:
      - "Qwen3.5-9B-MLX-4bit"
      # Dictation-cleanup hot path (run multiple times/hour) — kept resident so
      # every cleanup is instant, never paying the ~6s cold-load. ~24GB RSS /
      # ~4GB phys; coexists with workhorse models (always-on is never evicted).
      - "Qwen3.6-35B-A3B"
      # image-sort default classifier (stock 26B MoE) — resident so the sorter
      # never pays a cold-load swap (a wedged swap once hung a call ~10min;
      # swap:false here means it never cold-loads again). 14/14 in the bake-off,
      # ~2x faster than the 31B dense.
      - "gemma-4-26B-A4B-it"
      # EXPERIMENT(alexwu): 31B dense moved here from workhorse to gauge the
      # always-resident perf impact (instant availability, no cold-load) against
      # the unified-memory cost of co-residing permanently with the 26B MoE +
      # 35B heretic (swap:false → all three held at once). Revert to workhorse
      # if the memory pressure isn't worth the instant access.
      - "gemma-4-31B-it"

  # Code-completion / next-edit models — one resident at a time (`swap: true`):
  # you drive a single completion provider at a time (Zed's zeta OR Sweep), so
  # they trade the one slot instead of all sitting resident. `persistent: true`
  # keeps the active one from eviction by default-group one-offs mid-edit;
  # `exclusive: false` so loading one never disturbs always-on / workhorse.
  # CAVEAT(alexwu): if you ever run Zed AND a Sweep-backed editor at the SAME
  # time, swap:true makes them thrash (each load evicts the other) — flip this
  # group to swap:false then so all four can co-reside.
  "code-completion":
    swap: true
    exclusive: false
    persistent: true
    members:
      - "sweepai/sweep-next-edit-1.5b"
      - "henrik3/sweep-next-edit-v2-7B"
      - "zed-industries/zeta-2"
      - "zed-industries/zeta-2.1"

  # Active-task workhorse tier. One member at a time within the group
  # (`swap: true`), but small default-group churn (one-off / default-group
  # models) cannot evict them (`persistent: true`), and loading a workhorse
  # does not unload always-on (`exclusive: false`). TTL still applies as
  # the idle-eviction backstop — `persistent` only blocks other-group
  # unloads, not the model's own ttl timer. Reserve a separate "heavy"
  # group later for the true heavyweights (122B / Mistral Medium).
  "workhorse":
    swap: true
    exclusive: false
    persistent: true
    members:
      - "Qwen3.6-27B"
      - "Qwen3.6-35B-A3B"
      - "Qwen3.6-27B-heretic"
      - "Qwen3.6-35B-A3B-heretic"

