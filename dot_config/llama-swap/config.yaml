  # Abliterated ("heretic") twin of Qwen3.6-27B — uncensored vision + text.
  # Same flags/sampling as the censored 27B above; only the weights differ.
  # NOTE(alexwu): "Native MTP Preserved" is real — `--spec-type draft-mtp`
  # ENABLED, matching unsloth's "dense models 1.4-2x with MTP" benchmark.
  # n-max TUNED to 3 by measurement on THIS Metal build (256-tok, warm):
  #   no-mtp 13.2 tok/s | n-max 2 → ~20 tok/s (51% accept) | n-max 3 → ~26
  #   tok/s (~42% accept). 3 wins on throughput despite lower per-token
  #   acceptance — it proposes more tokens/step, netting more accepts/step.
  # unsloth's "use 2" is a general default; they say tune per hardware (1-6),
  # and 3 is fastest here. The ~1GB MTP heads load to VRAM regardless (free).
  # CAVEAT (ggml-org/llama.cpp#23636): acceptance can collapse near KV-slot
  # boundaries at large ctx — verified only at short ctx; drop the flag if
  # long-fill captions stall. Ref: unsloth.ai/docs/models/qwen3.6 (MTP Guide).
  # Weights downloaded via `pueue` (label claude: dl-qwen36-27b-heretic-v2)
  # to ~/.cache/huggingface/models/llmfan46/.
  "Qwen3.6-27B-heretic":
    cmd: llama-server --port ${PORT} --ctx-size 262144 --cache-type-k q8_0 --cache-type-v q8_0 --cache-reuse 256 -ngl 99 --flash-attn auto --spec-type draft-mtp --spec-draft-n-max 3 --batch-size 2048 --ubatch-size 512 --jinja --reasoning-format deepseek --model /Users/jamesbombeelu/.cache/huggingface/models/llmfan46/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-GGUF/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-Q5_K_M.gguf --mmproj /Users/jamesbombeelu/.cache/huggingface/models/llmfan46/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    ttl: 6000
    filters:
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.7
          top_p: 0.8
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:thinking":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0
          chat_template_kwargs:
            enable_thinking: true

  # Abliterated ("heretic") twin of Qwen3.6-35B-A3B — uncensored vision + text.
