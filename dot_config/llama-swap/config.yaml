    # wedge. (setParamsByID is even worse: a per-request body rewrite that hung on
    # system-prompt + multimodal requests.) Sampling = Google's gemma-4 defaults.
  # MTP twin of gemma-4-31B-it above — same Q5_K_M weights, sampling, and the
  # peg-gemma4 `--reasoning off` wedge fix; adds speculative decoding.
  # NOTE(alexwu): gemma's MTP is architecturally DIFFERENT from Qwen3.6's. Qwen
